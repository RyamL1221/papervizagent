# Model and API Configuration for PaperVizAgent
# Rename this file to specific config, e.g. "my_config.yaml" or leave as is.

# Default Models
defaults:
  model_name: "" # e.g., "gemini-3-pro-preview"
  image_model_name: "" # e.g., "gemini-3-pro-image-preview"

# Google Cloud / Vertex AI settings
google_cloud:
  project_id: "" # Your Google Cloud Project ID
  location: "global" # e.g. "us-central1" or "global"
  
# API Keys (alternatives to Application Default Credentials)
api_keys:
  google_api_key: ""
  openai_api_key: ""
  anthropic_api_key: ""
  
# Azure OpenAI settings (optional; off by default)
# When enabled, OpenAI calls are routed through an Azure OpenAI resource
# instead of the standard OpenAI API. Leave everything empty/false to keep the
# default behavior. Azure is used if use_azure is true, OR if endpoint, api_key,
# and api_version are all set. When active, the deployment name is sent as the
# "model" to the API (model_name/image_model_name are used only as a fallback
# when a deployment name is empty).
azure_openai:
  use_azure: false          # when true, route OpenAI calls through Azure
  api_key: ""               # Azure OpenAI API key
  endpoint: ""              # e.g. "https://my-resource.openai.azure.com/"
  api_version: ""           # e.g. "2024-10-21"
  chat_deployment: ""       # Azure deployment name for text/chat model
  image_deployment: ""      # Azure deployment name for image model

# Anthropic Vertex Settings (if you want to use Anthropic via Vertex)
anthropic:
  region: "us-central1"
  project_id: "" # Leave empty to use google_cloud.project_id
